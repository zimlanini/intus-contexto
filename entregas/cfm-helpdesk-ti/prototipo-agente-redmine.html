<title>Agente no Redmine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de topo no vernáculo do Redmine, fila à esquerda, ticket à direita; tudo que o agente produz fica em superfície própria (verde-petróleo) para separar do conteúdo nativo */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#1f2a33; --muted:#5d6b77; --line:#d9e0e6;
  --native:#3d5d7a; --native-ink:#ffffff; --native-soft:#e6edf4;
  --agent:#0e6b63; --agent-soft:#e3f2ef; --agent-line:#a9d6cf;
  --ok:#2f7d32; --ok-soft:#e5f3e5; --warn:#9a6100; --warn-soft:#fbf0db; --esc:#a33a3a; --esc-soft:#f8e4e4;
  --pend:#7a4fa0;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171c; --surface:#1a2128; --fg:#dde5ec; --muted:#93a2ae; --line:#2c3640;
  --native:#2a4560; --native-ink:#e8eff6; --native-soft:#203242;
  --agent:#5cc4b6; --agent-soft:#15302d; --agent-line:#2b5a54;
  --ok:#7cc77f; --ok-soft:#1c3320; --warn:#e2b25a; --warn-soft:#352a14; --esc:#ec8f8f; --esc-soft:#3a1f1f;
  --pend:#c3a2e2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --surface:#1a2128; --fg:#dde5ec; --muted:#93a2ae; --line:#2c3640;
  --native:#2a4560; --native-ink:#e8eff6; --native-soft:#203242;
  --agent:#5cc4b6; --agent-soft:#15302d; --agent-line:#2b5a54;
  --ok:#7cc77f; --ok-soft:#1c3320; --warn:#e2b25a; --warn-soft:#352a14; --esc:#ec8f8f; --esc-soft:#3a1f1f;
  --pend:#c3a2e2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
.top{background:var(--native);color:var(--native-ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.top h1{font-size:16px;font-weight:600;margin:0}
.top small{opacity:.8;font-size:12px;display:block}
.mode{display:flex;gap:0;border:1px solid rgba(255,255,255,.4);border-radius:6px;overflow:hidden}
.mode button{font:inherit;font-size:13px;background:transparent;color:var(--native-ink);border:0;padding:6px 12px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--native-ink);color:var(--native);font-weight:600}
.mode button:focus-visible,button:focus-visible,.row:focus-visible{outline:2px solid var(--agent);outline-offset:2px}
.wrap{padding-inline:16px;padding-block:16px;max-width:1360px;margin:0 auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.sum div{padding:10px 12px;border-right:1px solid var(--line)}
.sum div:last-child{border-right:0}
.sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:600}
.sum span{font-size:12px;color:var(--muted)}
.cmp{font-size:12px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chipbtn{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--native-soft);border-color:var(--native);font-weight:600}
.list{max-height:calc(100vh - 260px);overflow:auto}
@media (max-width:900px){.list{max-height:none}}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.row:hover{background:var(--native-soft)}
.row[aria-current="true"]{background:var(--native-soft);box-shadow:inset 3px 0 0 var(--native)}
.id{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:1px}
.subj{min-width:0}
.subj strong{font-weight:500;display:block;overflow-wrap:anywhere}
.subj small{color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:600;border-radius:4px;padding:2px 7px;white-space:nowrap;letter-spacing:.02em}
.p-responde{background:var(--ok-soft);color:var(--ok)}
.p-rascunho{background:var(--warn-soft);color:var(--warn)}
.p-escala{background:var(--esc-soft);color:var(--esc)}
.p-enviado{background:var(--native-soft);color:var(--fg)}
.detail{padding:16px 18px;display:grid;gap:16px}
.crumb{font-size:12px;color:var(--muted)}
.detail h2{font-size:19px;margin:2px 0 0;font-weight:600;text-wrap:balance}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;font-size:13px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:10px}
@media (max-width:520px){.meta{grid-template-columns:minmax(0,1fr)}}
.meta div{display:flex;gap:8px;min-width:0}
.meta dt{color:var(--muted);min-width:110px}
.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.desc{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:13.5px;overflow-wrap:anywhere}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 6px}
.agent{border:1px solid var(--agent-line);background:var(--agent-soft);border-radius:6px;padding:14px;display:grid;gap:14px}
.agent-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.agent-h .who{color:var(--agent);font-weight:600;font-size:13px}
.cls{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;border:1px solid var(--agent-line);background:var(--surface);border-radius:4px;padding:2px 8px}
.tag em{font-style:normal;color:var(--muted)}
.why{font-size:13.5px;margin:0}
.flag{font-size:13px;border-left:3px solid var(--esc);background:var(--surface);padding:6px 10px;border-radius:0 4px 4px 0}
textarea{width:100%;min-height:150px;font:inherit;font-size:13.5px;line-height:1.5;color:var(--fg);background:var(--surface);border:1px solid var(--agent-line);border-radius:4px;padding:10px;resize:vertical}
.sent{white-space:pre-wrap;background:var(--surface);border:1px solid var(--agent-line);border-radius:4px;padding:10px 12px;font-size:13.5px}
.pendtxt{color:var(--pend);font-weight:500}
ul.src{margin:0;padding-left:18px;font-size:13px}
ul.src li{margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:13px;border-radius:4px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--agent);border-color:var(--agent);color:var(--surface);font-weight:600}
.journal{border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
.journal p{margin:0 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px}
.note{font-size:12px;color:var(--muted);padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.row{transition:background .12s}}
</style>

<header class="top">
  <div>
    <h1>Help Desk TI · Redmine simulado</h1>
    <small>Protótipo interno Intus. Tickets fictícios. Trechos em roxo dependem de documento que ainda não temos.</small>
  </div>
  <div class="mode" role="group" aria-label="Modo do agente">
    <button id="m-rascunho" type="button" aria-pressed="true">Rascunho para aprovação</button>
    <button id="m-direto" type="button" aria-pressed="false">Responde direto</button>
  </div>
</header>

<main class="wrap">
  <section class="panel" aria-label="Fila de tickets">
    <div class="sum" id="sum"></div>
    <div class="cmp" id="cmp"></div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
    <div class="note">Clique num ticket para ver o que o agente fez e com base em quê.</div>
  </section>
  <section class="panel" aria-label="Ticket" id="detail"></section>
</main>
<div class="toast" id="toast" hidden></div>

const FR = ["Certificado Digital","Manual PF","Manual PJ","PAe","Prescrição Eletrônica"];
const S = {mode:"rascunho",sel:4101,fr:null,enviados:{}};
const $ = id => document.getElementById(id);

function acaoDe(t){
  if(S.enviados[t.id]) return "enviado";
  if(t.acao==="escala") return "escala";
  return S.mode==="direto" ? t.acao : "rascunho";
}
const LBL = {responde:"Respondido pelo agente",rascunho:"Rascunho para aprovar",escala:"Escalado",enviado:"Enviado após revisão"};
function contar(mode){
  const c={responde:0,rascunho:0,escala:0};
  T.forEach(t=>{ if(t.acao==="escala") c.escala++; else c[mode==="direto"?t.acao:"rascunho"]++; });
  return c;
}
function statusDe(t,a){
  return {responde:"Feedback (aguarda solicitante)",rascunho:"Em andamento (revisão humana)",escala:"Em andamento",enviado:"Feedback (aguarda solicitante)"}[a];
}
function atribDe(t,a){
  if(a==="escala") return t.para;
  if(a==="responde") return "Agente Help Desk";
  return "Suporte N1 (revisão)";
}

function renderSum(){
  const c = contar(S.mode), o = contar(S.mode==="direto"?"rascunho":"direto");
  $("sum").innerHTML = [["responde","Respondidos pelo agente"],["rascunho","Rascunhos para aprovar"],["escala","Escalados"]]
    .map(([k,l])=>`<div><b style="color:var(--${k==="responde"?"ok":k==="rascunho"?"warn":"esc"})">${c[k]}</b><span>${l}</span></div>`).join("");
  const outro = S.mode==="direto" ? "Rascunho para aprovação" : "Responde direto";
  $("cmp").textContent = `No modo "${outro}": ${o.responde} respondidos, ${o.rascunho} rascunhos, ${o.escala} escalados. Mesmos 20 tickets.`;
}
function renderFilters(){
  const all = [null,...FR];
  $("filters").innerHTML = all.map(f=>`<button type="button" class="chipbtn" data-f="${f??""}" aria-pressed="${S.fr===f}">${f??"Todas as frentes"} <span style="color:var(--muted)">${f?T.filter(t=>t.fr===f).length:T.length}</span></button>`).join("");
  $("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.fr=b.dataset.f||null;render();});
}
function renderList(){
  const rows = T.filter(t=>!S.fr||t.fr===S.fr);
  $("list").innerHTML = rows.map(t=>{const a=acaoDe(t);return `<div class="row" role="button" tabindex="0" data-id="${t.id}" aria-current="${t.id===S.sel}">
    <span class="id">#${t.id}</span>
    <span class="subj"><strong>${esc(t.assunto)}</strong><small>${t.tr} · ${t.fr} · ${esc(t.sol)}</small></span>
    <span class="pill p-${a}">${LBL[a]}</span></div>`}).join("");
  $("list").querySelectorAll(".row").forEach(r=>{
    const go=()=>{S.sel=+r.dataset.id;render();if(window.matchMedia("(max-width:900px)").matches)$("detail").scrollIntoView({behavior:"smooth"});};
    r.onclick=go; r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};
  });
}
function renderDetail(){
  const t = T.find(x=>x.id===S.sel), a = acaoDe(t);
  const meta = [["Status",statusDe(t,a)],["Prioridade",t.prio+(t.prioSug!==t.prio?` → sugerida ${t.prioSug}`:"")],["Atribuído para",atribDe(t,a)],["Categoria",t.fr],["Solicitante",t.sol+" ("+t.ts+")"],["Canal",t.canal],["Início",t.data],["Tracker",t.tr]]
    .map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("");
  const tags = `<span class="tag"><em>Frente</em> ${t.fr}</span><span class="tag"><em>Tipo</em> ${t.tipo}</span><span class="tag"><em>Certeza</em> ${t.conf}</span>${t.cruza?`<span class="tag"><em>Cruza com</em> ${t.cruza}</span>`:""}${t.prioSug!==t.prio?`<span class="tag"><em>Prioridade</em> ${t.prio} → ${t.prioSug}</span>`:""}`;
  let corpo = "";
  if(a==="escala"){
    corpo = `<div><p class="lbl">Encaminhado para</p><p class="why"><strong>${esc(t.para)}</strong></p></div>
      <div><p class="lbl">Nota interna para quem assume</p><div class="sent">${P(esc(t.nota))}</div></div>`;
  } else if(a==="rascunho"){
    corpo = `<div><p class="lbl">Rascunho de resposta ao solicitante</p><textarea id="draft-${t.id}" aria-label="Rascunho de resposta">${esc(t.resp)}</textarea></div>
      <div class="actions"><button type="button" class="btn primary" id="aprovar">Aprovar e enviar</button><button type="button" class="btn" id="escalar">Escalar para N2</button></div>`;
  } else {
    const txt = a==="enviado" ? S.enviados[t.id] : t.resp;
    corpo = `<div><p class="lbl">${a==="enviado"?"Resposta enviada após revisão humana":"Resposta enviada pelo agente"}</p><div class="sent">${P(esc(txt))}</div></div>`;
  }
  const falta = t.falta.length ? `<div><p class="lbl">O que falta para responder sem ressalva</p><ul class="src">${t.falta.map(f=>`<li class="pendtxt">${esc(f)}</li>`).join("")}</ul></div>` : "";
  const hist = a==="responde" ? `<p>Agente Help Desk alterou Status para Feedback e adicionou resposta.</p>`
    : a==="enviado" ? `<p>Suporte N1 aprovou o rascunho do agente e enviou.</p>`
    : a==="escala" ? `<p>Agente Help Desk alterou Atribuído para ${esc(t.para)} e adicionou nota interna.</p>` : `<p>Agente Help Desk adicionou rascunho privado. Aguardando revisão.</p>`;
  $("detail").innerHTML = `<div class="detail">
    <div><div class="crumb">${t.tr} #${t.id}</div><h2>${esc(t.assunto)}</h2></div>
    <dl class="meta">${meta}</dl>
    <div><p class="lbl">Descrição</p><div class="desc">${P(esc(t.desc))}</div></div>
    <div class="agent">
      <div class="agent-h"><span class="who">Agente Help Desk</span><span class="pill p-${a}">${LBL[a]}</span></div>
      <div class="cls">${tags}</div>
      <div><p class="lbl">Por que esta decisão</p><p class="why">${esc(t.why)}</p></div>
      ${t.flag?`<div class="flag">${esc(t.flag)}</div>`:""}
      ${corpo}
      <div><p class="lbl">Fontes consultadas</p><ul class="src">${t.src.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      ${falta}
    </div>
    <div class="journal"><p class="lbl">Histórico</p>${hist}</div>
  </div>`;
  if(a==="rascunho"){
    $("aprovar").onclick=()=>{S.enviados[t.id]=$("draft-"+t.id).value;toast(`Resposta do #${t.id} enviada ao solicitante`);render();};
    $("escalar").onclick=()=>toast("No protótipo, escalar manualmente só registra a intenção");
  }
}
let tt;function toast(m){const el=$("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2400);}
function setMode(m){S.mode=m;$("m-rascunho").setAttribute("aria-pressed",m==="rascunho");$("m-direto").setAttribute("aria-pressed",m==="direto");render();}
$("m-rascunho").onclick=()=>setMode("rascunho");
$("m-direto").onclick=()=>setMode("direto");
function render(){renderSum();renderFilters();renderList();renderDetail();}
render();
</script>
